# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven
name: Build & Test

on:
  push:
    branches: [ master, development ]
  pull_request:
    branches: [ master, development ]
  schedule:
    - cron: "0 0 * * *" # At the end of every day

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 1.8
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '8'
          distribution: temurin
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          settings-path: ${{ github.workspace }} # location for the settings.xml file

      - name: Build with Maven
        run: mvn -B package --file pom.xml
  test:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 1.8
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '8'
          distribution: temurin

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4
        
      - name: Integration Tests
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}
        run: |
          client_id="$(doppler secrets get PLUGGY_CLIENT_ID --plain)"
          client_secret="$(doppler secrets get PLUGGY_CLIENT_SECRET --plain)"
          base_url="$(doppler secrets get PLUGGY_BASE_URL --plain)"

          printf '::add-mask::%s\n' "$client_id"
          printf '::add-mask::%s\n' "$client_secret"
          printf '::add-mask::%s\n' "$base_url"
          unset DOPPLER_TOKEN

          PLUGGY_CLIENT_ID="$client_id" \
          PLUGGY_CLIENT_SECRET="$client_secret" \
          PLUGGY_BASE_URL="$base_url" \
            mvn -B verify --file pom.xml
