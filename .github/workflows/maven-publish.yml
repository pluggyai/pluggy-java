# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java#apache-maven-with-a-settings-path
name: Maven Deploy to GitHub Packages

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Release tag version (e.g., v1.8.4)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      release_ref: ${{ steps.resolve.outputs.release_ref }}
    steps:
      - name: Validate release tag
        id: resolve
        env:
          RELEASE_REF: ${{ github.event.release.tag_name || inputs.tag_version }}
        run: |
          if [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_REF" >&2
            exit 1
          fi
          printf 'release_ref=%s\n' "$RELEASE_REF" >> "$GITHUB_OUTPUT"

  build:
    needs: validate-ref
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-ref.outputs.release_ref }}
          persist-credentials: false

      - name: Set up JDK 1.8
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '8'
          distribution: temurin
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          settings-path: ${{ github.workspace }} # location for the settings.xml file

      - name: Build with Maven
        run: mvn -B package --file pom.xml
  test:
    needs: [validate-ref, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-ref.outputs.release_ref }}
          persist-credentials: false

      - name: Set up JDK 1.8
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '8'
          distribution: temurin

      - name: Integration Tests
        env:
          PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
          PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
          PLUGGY_BASE_URL: ${{ secrets.PLUGGY_BASE_URL }}
          PLUGGY_RSA_PUBLIC_KEY: ${{ secrets.PLUGGY_RSA_PUBLIC_KEY }}
        run: mvn -B verify --file pom.xml
  deploy:
    runs-on: ubuntu-latest
    needs: [validate-ref, build, test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-ref.outputs.release_ref }}
          persist-credentials: false

      - name: Set up JDK 1.8
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '8'
          distribution: temurin
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          settings-path: ${{ github.workspace }} # location for the settings.xml file
          
      - name: Publish to GitHub Packages Apache Maven
        run: mvn deploy -Dmaven.test.skip.exec -s "$GITHUB_WORKSPACE/settings.xml" # skip tests in this step
        env:
          GITHUB_TOKEN: ${{ github.token }}
